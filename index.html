<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TusaBots</title>
<style>
:root{
  --bg-primary:#140f0a;
  --bg-secondary:#0d1117;
  --bg-card:rgba(28,18,10,0.44);
  --accent-cyan:#f5a623;
  --accent-blue:#c9741f;
  --accent-purple:#7b61ff;
  --accent-green:#00ff88;
  --accent-amber:#d4910a;
  --accent-rust:#b45a2a;
  --text-primary:#e6edf3;
  --text-secondary:#8b949e;
  --text-muted:#484f58;
  --glass-bg:rgba(13,17,23,0.7);
  --glass-border:rgba(245,166,35,0.15);
  --glow-cyan:0 0 20px rgba(245,166,35,0.3);
  --radius:16px;
  --transition:0.3s cubic-bezier(0.4,0,0.2,1)
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.6;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* Nav */
nav{position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:var(--glass-bg);border-bottom:1px solid var(--glass-border);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-login-btn{background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);border-radius:8px;padding:0.4rem 1rem;color:var(--text-secondary);font-size:0.85rem;font-weight:600;cursor:pointer;transition:all var(--transition);font-family:inherit}
.nav-login-btn:hover{border-color:var(--accent-cyan);color:var(--accent-cyan);background:rgba(245,166,35,0.06)}

/* Main layout */
.main-content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 1rem 1rem;max-width:1400px;width:100%;margin:0 auto}

/* Chat layout: single centred chat column (Twitch removed — chat is the hero) */
.stream-layout{display:flex;justify-content:center;gap:0.85rem;width:100%;flex:1;min-height:0;max-height:calc(100vh - 90px)}

/* Chat container — now the centred full-height hero (max ~780px for readability) */
.public-chat{flex:1 1 auto;width:100%;max-width:780px;display:flex;flex-direction:column;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius);min-height:0}
.chat-header{padding:0.75rem 1.25rem;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;gap:0.5rem;flex-shrink:0}
.chat-header-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-amber);box-shadow:0 0 6px var(--accent-amber);animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:0.4}}
.chat-header-text{font-size:0.85rem;color:var(--text-muted);font-weight:600;letter-spacing:0.03em;text-transform:uppercase}
.chat-online-count{margin-left:auto;font-size:0.75rem;color:var(--text-muted)}

/* Messages */
.chat-messages{flex:1;padding:1rem 1.25rem;overflow-y:auto;display:flex;flex-direction:column;gap:0.6rem;min-height:0}
.chat-msg{display:flex;flex-direction:column;gap:0.15rem;animation:msgIn 0.25s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-msg-name{font-size:0.7rem;font-weight:600;color:var(--text-muted);letter-spacing:0.02em;padding-left:0.2rem}
.chat-msg-name.bot-name{color:var(--accent-amber)}
.chat-msg-bubble{max-width:85%;padding:0.55rem 0.9rem;border-radius:12px;font-size:1rem;line-height:1.5;word-wrap:break-word}
.chat-msg.visitor .chat-msg-bubble{align-self:flex-end;background:linear-gradient(135deg,rgba(245,166,35,0.15),rgba(201,116,31,0.15));border:1px solid rgba(245,166,35,0.12);color:var(--text-primary)}
.chat-msg.visitor .chat-msg-name{text-align:right;padding-right:0.2rem}
.chat-msg.visitor{align-items:flex-end}
.chat-msg.bot .chat-msg-bubble{align-self:flex-start;background:rgba(212,145,10,0.08);border:1px solid rgba(212,145,10,0.15);color:var(--text-primary);font-size:1rem}

/* Input area */
.chat-input-area{display:flex;align-items:center;gap:0.6rem;padding:0.75rem 1rem;border-top:1px solid var(--glass-border);flex-shrink:0}

/* Pixel-art robot head canvas (matches dashboard Unit-7 tile, scaled up) */
.robot-hero{flex:0 0 auto;display:flex;justify-content:center;align-items:flex-end;width:100%;margin-bottom:0.4rem;pointer-events:none;animation:headFloat 4s ease-in-out infinite}
.robot-canvas{width:clamp(120px,26vw,220px);height:auto;aspect-ratio:1;image-rendering:pixelated;pointer-events:auto;filter:drop-shadow(0 4px 16px rgba(255,68,68,0.35)) drop-shadow(0 0 8px rgba(255,68,68,0.2));cursor:pointer;-webkit-user-select:none;user-select:none}
@keyframes headFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (max-width:900px){.robot-canvas{width:clamp(80px,24vw,160px)}}

.chat-input{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:10px;padding:0.6rem 0.85rem;color:var(--text-primary);font-size:16px;font-family:inherit;outline:none;transition:border-color var(--transition),box-shadow var(--transition)}
.chat-input::placeholder{color:var(--text-muted)}
.chat-input:focus{border-color:var(--accent-cyan);box-shadow:0 0 0 3px rgba(245,166,35,0.1)}
.chat-send-btn{background:linear-gradient(135deg,var(--accent-amber),var(--accent-rust));border:none;border-radius:10px;padding:0.6rem 1.1rem;color:#fff;font-size:0.85rem;font-weight:600;cursor:pointer;transition:transform var(--transition),box-shadow var(--transition);font-family:inherit;flex-shrink:0}
.chat-send-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 12px rgba(212,145,10,0.3)}
.chat-send-btn:disabled{opacity:0.4;cursor:not-allowed}

/* Auth Modal (hidden by default, shown on Login click) */
.auth-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.auth-modal-overlay.visible{display:flex}
.auth-modal{background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius);padding:2.5rem 2rem;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);position:relative}
.auth-close-btn{position:absolute;top:0.75rem;right:0.75rem;background:none;border:none;color:var(--text-muted);font-size:1.3rem;cursor:pointer;padding:0.25rem;line-height:1;transition:color var(--transition)}
.auth-close-btn:hover{color:var(--text-primary)}
.auth-modal h2{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.25rem}
.auth-subtitle{color:var(--text-secondary);font-size:0.9rem;margin-bottom:2rem}
.auth-tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:1px solid var(--glass-border)}
.auth-tab{flex:1;padding:0.6rem;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);font-size:0.9rem;font-weight:600;cursor:pointer;transition:color var(--transition),border-color var(--transition);font-family:inherit}
.auth-tab.active{color:var(--accent-cyan);border-bottom-color:var(--accent-cyan)}
.auth-form{display:flex;flex-direction:column;gap:1rem;text-align:left}
.auth-form label{font-size:0.8rem;font-weight:600;color:var(--text-secondary);letter-spacing:0.05em;text-transform:uppercase}
.auth-form input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:10px;padding:0.75rem 1rem;color:var(--text-primary);font-size:0.95rem;font-family:inherit;outline:none;transition:border-color var(--transition),box-shadow var(--transition)}
.auth-form input::placeholder{color:var(--text-muted)}
.auth-form input:focus{border-color:var(--accent-cyan);box-shadow:0 0 0 3px rgba(245,166,35,0.1)}
.auth-submit-btn{margin-top:0.5rem;width:100%;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-blue));border:none;border-radius:10px;padding:0.85rem;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:transform var(--transition),box-shadow var(--transition),opacity var(--transition);font-family:inherit}
.auth-submit-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--glow-cyan)}
.auth-submit-btn:disabled{opacity:0.5;cursor:not-allowed}
.auth-error{background:rgba(255,70,70,0.1);border:1px solid rgba(255,70,70,0.3);border-radius:8px;padding:0.75rem 1rem;font-size:0.85rem;color:#ff6b6b;text-align:center}
.auth-switch-link{margin-top:1rem;font-size:0.85rem;color:var(--text-muted)}
.auth-switch-link button{background:none;border:none;color:var(--accent-cyan);cursor:pointer;font-size:0.85rem;font-family:inherit;text-decoration:underline;padding:0}

/* Name prompt */
.name-prompt{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);z-index:150;display:flex;align-items:center;justify-content:center;padding:1rem}
.name-prompt-box{background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius);padding:2rem;width:100%;max-width:340px;text-align:center}
.name-prompt-box h3{font-size:1.1rem;color:var(--text-primary);margin-bottom:0.5rem}
.name-prompt-box p{font-size:0.85rem;color:var(--text-muted);margin-bottom:1.25rem}
.name-prompt-box input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:10px;padding:0.65rem 0.85rem;color:var(--text-primary);font-size:0.95rem;font-family:inherit;outline:none;text-align:center;margin-bottom:1rem}
.name-prompt-box input:focus{border-color:var(--accent-amber)}
.name-prompt-box button{background:linear-gradient(135deg,var(--accent-amber),var(--accent-rust));border:none;border-radius:10px;padding:0.65rem 1.5rem;color:#fff;font-weight:600;cursor:pointer;font-family:inherit;font-size:0.9rem}

footer{position:relative;z-index:1;text-align:center;padding:0.75rem 1rem;color:var(--text-muted);font-size:0.75rem;border-top:1px solid var(--glass-border);flex-shrink:0}

@media(max-width:900px){
  /* Lock the whole view to the real visible viewport height (dvh accounts for
     the mobile address bar) so chat + input fit with no page scroll. */
  .main-content{padding:58px 0.5rem 0.5rem;height:100dvh;max-height:100dvh;justify-content:flex-start}
  .stream-layout{flex-direction:column;max-height:none;height:100%;gap:0.5rem}
  /* Head shrinks to a capped band on mobile so the chat always keeps room. */
  .robot-hero{flex:0 1 auto;min-height:0;margin-bottom:0.2rem}
  .robot-canvas{max-height:18vh;width:auto}
  /* Chat fills all available height; min-height:0 lets its inner list scroll. */
  .public-chat{flex:1 1 auto;width:100%;max-width:none;min-height:0}
  .chat-messages{flex:1 1 auto;min-height:0}
  .chat-input-area{flex-shrink:0}
  .chat-msg-bubble{max-width:92%}
}
@media(max-width:600px){
  nav{padding:0 0.75rem}
  .chat-header{padding:0.5rem 0.9rem}
  .chat-messages{padding:0.75rem 0.9rem}
}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<nav>
  <div class="nav-logo">&#x1F916; TusaBots</div>
  <button class="nav-login-btn" id="login-btn">Login</button>
</nav>

<!-- Auth Modal (hidden, shown on Login click) -->
<div class="auth-modal-overlay" id="auth-modal">
  <div class="auth-modal">
    <button class="auth-close-btn" id="auth-close">&times;</button>
    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Sign in to access your personal AI assistant</p>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-signin" type="button">Sign In</button>
      <button class="auth-tab" id="tab-signup" type="button">Sign Up</button>
    </div>
    <div class="auth-error" id="auth-error" style="display:none"></div>
    <form class="auth-form" id="auth-form">
      <div>
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div>
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="auth-submit-btn" id="auth-submit-btn">Sign In</button>
    </form>
    <p class="auth-switch-link" id="auth-switch-text">
      Don't have an account?
      <button type="button" id="auth-switch-btn">Sign up</button>
    </p>
  </div>
</div>

<!-- Main content: full-page group chat (Twitch removed) -->
<div class="main-content">
  <div class="robot-hero">
    <canvas class="robot-canvas" id="robot-canvas" width="176" height="176" role="img" aria-label="Unit-7 the front-desk robot"></canvas>
  </div>
  <div class="stream-layout">
    <div class="public-chat" id="public-chat">
    <div class="chat-header">
      <div class="chat-header-dot"></div>
      <span class="chat-header-text">Factory Floor — Unit-7 Online</span>
      <span class="chat-online-count" id="online-count"></span>
    </div>
    <div class="chat-messages" id="chat-messages">
      <!-- Messages rendered here -->
    </div>
    <div class="chat-input-area">
      <input type="text" class="chat-input" id="chat-input" placeholder="Say something to Unit-7..." autocomplete="off" maxlength="500" disabled>
      <button class="chat-send-btn" id="chat-send" disabled>Send</button>
    </div>
    </div>
  </div>
</div>

<footer><p>TusaBots 2026</p></footer>

<!-- Dusty warehouse-lobby background (factory-lobby theme) -->
<script src="/js/bg-warehouse.js"></script>

<!-- Pixel Robot Head rendering -->
<script src="/js/robot-head.js"></script>

<!-- Auth logic (preserved, now modal-triggered) -->
<script type="module" src="/js/index-auth.js"></script>

<!-- Supabase Realtime client (CDN, for public chat only) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp" crossorigin="anonymous"></script>

<!-- Public Group Chat Logic -->
<script src="/js/public-chat.js"></script>

</body>
</html>
