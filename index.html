<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#080b0f;color:#e8f4f0;min-height:100vh}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
nav{position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:blur(20px);background:rgba(8,14,20,0.8);border-bottom:1px solid rgba(57,217,138,0.15);padding:0 2.5rem;height:60px;display:flex;align-items:center}
.nav-logo{font-size:1.15rem;font-weight:700;color:#39d98a}
.hero{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;padding:80px 5% 60px;gap:4%}
.hero-content{flex:0 0 42%;max-width:500px}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:0.75rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#39d98a;background:rgba(57,217,138,0.1);border:1px solid rgba(57,217,138,0.2);border-radius:100px;padding:5px 14px;margin-bottom:1.5rem}
.eyebrow-dot{width:6px;height:6px;border-radius:50%;background:#39d98a;animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.7)}}
.hero h1{font-size:clamp(2.2rem,4.5vw,3.4rem);font-weight:800;color:#fff;line-height:1.15;letter-spacing:-0.03em;margin-bottom:1.25rem}
.hero h1 em{font-style:normal;color:#39d98a}
.hero p{font-size:1.05rem;color:#7a9e8a;max-width:420px;margin-bottom:2.5rem;line-height:1.7}
.status-badge{display:inline-flex;align-items:center;gap:10px;background:rgba(57,217,138,0.07);border:1px solid rgba(57,217,138,0.15);border-radius:12px;padding:12px 18px;font-size:0.85rem;color:#39d98a}
.status-dot{width:8px;height:8px;border-radius:50%;background:#39d98a;flex-shrink:0;animation:statusPulse 2.5s ease-in-out infinite}
@keyframes statusPulse{0%,100%{box-shadow:0 0 0 0 rgba(57,217,138,0.4)}50%{box-shadow:0 0 0 6px rgba(57,217,138,0)}}
.hero-right{flex:1;display:flex;flex-direction:column;align-items:center;gap:24px;max-width:560px;margin-left:auto}
.chat-widget{width:100%;background:rgba(12,18,28,0.75);border:1px solid rgba(57,217,138,0.15);border-radius:18px;backdrop-filter:blur(20px);overflow:hidden;box-shadow:0 0 20px rgba(57,217,138,0.25),0 30px 80px rgba(0,0,0,0.4)}
.chat-header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:rgba(57,217,138,0.07);border-bottom:1px solid rgba(57,217,138,0.15)}
.chat-header-dot{width:9px;height:9px;border-radius:50%;background:#39d98a;box-shadow:0 0 8px #39d98a}
.chat-header-title{font-size:0.82rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#39d98a}
.chat-header-status{margin-left:auto;font-size:0.75rem;color:#3d5a47}
.chat-messages{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:200px;max-height:280px;overflow-y:auto}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-track{background:transparent}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(57,217,138,0.15);border-radius:4px}
.msg{display:flex;align-items:flex-end;gap:8px;animation:msgFadeIn 0.35s ease forwards;opacity:0}
@keyframes msgFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-user{flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:50%;background:rgba(57,217,138,0.15);border:1px solid rgba(57,217,138,0.25);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.msg-bubble{max-width:75%;padding:10px 15px;border-radius:14px;font-size:0.88rem;line-height:1.5}
.msg-bot .msg-bubble{background:rgba(57,217,138,0.1);border:1px solid rgba(57,217,138,0.18);border-bottom-left-radius:4px;color:#c8f0dc}
.msg-user .msg-bubble{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-bottom-right-radius:4px;color:#7a9e8a}
.typing-indicator{display:flex;align-items:center;gap:8px;animation:msgFadeIn 0.3s ease forwards;opacity:0}
.typing-indicator .msg-avatar{opacity:0.7}
.typing-dots{display:flex;gap:4px;padding:10px 15px;background:rgba(57,217,138,0.08);border:1px solid rgba(57,217,138,0.15);border-radius:14px;border-bottom-left-radius:4px}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:#39d98a;opacity:0.5;animation:dotBounce 1.2s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:0.15s}
.typing-dots span:nth-child(3){animation-delay:0.3s}
@keyframes dotBounce{0%,60%,100%{transform:translateY(0);opacity:0.5}30%{transform:translateY(-5px);opacity:1}}
.chat-input-area{display:flex;gap:10px;padding:14px 16px;border-top:1px solid rgba(57,217,138,0.15);background:rgba(0,0,0,0.2)}
.chat-input{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(57,217,138,0.12);border-radius:12px;padding:10px 14px;color:#e8f4f0;font-size:0.9rem;font-family:inherit;outline:none;transition:border-color 0.3s,box-shadow 0.3s}
.chat-input::placeholder{color:#3d5a47}
.chat-input:focus{border-color:rgba(57,217,138,0.4);box-shadow:0 0 0 3px rgba(57,217,138,0.08)}
.chat-send-btn{width:40px;height:40px;border-radius:12px;background:#39d98a;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.3s,box-shadow 0.3s;flex-shrink:0}
.chat-send-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 35px rgba(57,217,138,0.4)}
.chat-send-btn:disabled{opacity:0.4;cursor:not-allowed}
.robot-stage{width:100%;display:flex;justify-content:center;padding:0 20px}
.robot-wrapper{position:relative;user-select:none}
.robot-jump{animation:robotJump 0.5s ease-in-out}
.robot-spinning{animation:none;transition:transform 0.05s linear}
.chat-panel{margin-top:20px;width:100%;background:rgba(12,18,28,0.75);border:1px solid rgba(57,217,138,0.15);border-radius:18px;backdrop-filter:blur(20px);overflow:hidden}

.robot-wrapper.idle:active{animation-play-state:paused}
@keyframes robotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes robotJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.robot-svg{width:200px;height:280px;filter:drop-shadow(0 8px 30px rgba(57,217,138,0.25))}
.robot-eye{animation:eyeBlink 4s ease-in-out infinite;transform-origin:center}

.robot-antenna-light{animation:antennaGlow 2s ease-in-out infinite}
@keyframes antennaGlow{0%,100%{fill:#39d98a;filter:drop-shadow(0 0 5px #39d98a)}50%{fill:#7fffd4;filter:drop-shadow(0 0 12px rgba(127,255,212,0.8))}}

.auth-tab.active {
  color: var(--accent-cyan);
  border-bottom-color: var(--accent-cyan);
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  text-align: left;
}

.auth-form label {
  font-size: 0.8rem;

  color: var(--text-secondary);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.auth-form input {
  width: 100%;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  padding: 0.75rem 1rem;
  color: var(--text-primary);
  font-size: 0.95rem;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.auth-form input::placeholder { color: var(--text-muted); }
.auth-form input:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
}

.auth-submit-btn {
  margin-top: 0.5rem;
  width: 100%;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  border: none;
  border-radius: 10px;
  padding: 0.85rem;
  color: #fff;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
  font-family: inherit;
}

.auth-submit-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: var(--glow-cyan);
}

.auth-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.auth-error {
  background: rgba(255, 70, 70, 0.1);
  border: 1px solid rgba(255, 70, 70, 0.3);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  font-size: 0.85rem;
  color: #ff6b6b;
  text-align: center;
}

.auth-switch-link {
  margin-top: 1rem;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.auth-switch-link button {
  background: none;
  border: none;
  color: var(--accent-cyan);
  cursor: pointer;
  font-size: 0.85rem;
  font-family: inherit;
  text-decoration: underline;
  padding: 0;
}

<script>
(function(){
  var canvas=document.getElementById("bg-canvas"),ctx=canvas.getContext("2d"),particles=[],P=60;
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
  resize();window.addEventListener("resize",resize);
  function Particle(){this.reset()}
  Particle.prototype.reset=function(){
    this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;
    this.size=Math.random()*2+0.5;this.speedX=(Math.random()-0.5)*0.3;this.speedY=(Math.random()-0.5)*0.3;this.opacity=Math.random()*0.5+0.1;
  };
  Particle.prototype.update=function(){
    this.x+=this.speedX;this.y+=this.speedY;
    if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height)this.reset();
  };
  Particle.prototype.draw=function(){
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle="rgba(57,217,138,"+this.opacity+")";ctx.fill();
  };
  for(var i=0;i<P;i++){var p=new Particle();particles.push(p);}
  function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);
    for(var i=0;i<particles.length;i++){particles[i].update();particles[i].draw();}
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
<script>
(function(){
  var input=document.getElementById("chat-input");
  var sendBtn=document.getElementById("chat-send-btn");
  var messages=document.getElementById("chat-messages");
  var typing=document.createElement("div");
  typing.className="typing-indicator";
  typing.innerHTML="<div class=msg-avatar>&#x1F916;</div><div class=typing-dots><span></span><span></span><span></span></div>";
  function showTyping(){messages.appendChild(typing);messages.scrollTop=messages.scrollHeight;typing.style.opacity="1"}
  function hideTyping(){if(typing.parentNode)typing.remove()}
  function addBotMessage(text){
    hideTyping();
    var div=document.createElement("div");div.className="msg msg-bot";
    div.innerHTML="<div class=msg-avatar>&#x1F916;</div><div class=msg-bubble>"+text+"</div>";
    div.style.opacity="1";messages.appendChild(div);messages.scrollTop=messages.scrollHeight;
  }
  function sendMessage(){
    var text=input.value.trim();if(!text)return;
    var userDiv=document.createElement("div");userDiv.className="msg msg-user";
    userDiv.innerHTML="<div class=msg-avatar>&#x1F916;</div><div class=msg-bubble>"+text+"</div>";
    userDiv.style.opacity="1";messages.appendChild(userDiv);
    input.value="";messages.scrollTop=messages.scrollHeight;
    showTyping();
    setTimeout(function(){addBotMessage("We are under maintenance at the moment, check back soon, thank you")},800);
  }
  sendBtn.addEventListener("click",sendMessage);
  input.addEventListener("keypress",function(e){if(e.key==="Enter")sendMessage()});
})();
</script>

<script type="module">
import { signIn, signUp, getSession, handlePostLoginRedirect } from '/lib/auth.js';
let authMode = 'signin';

// Show the modal on page load
(async () => {
  // handlePostLoginRedirect() already routes authenticated users.
  if (await handlePostLoginRedirect()) return;
})();

// ── Tab switching ───────────────────────────────────────────────────────────
function setMode(mode) {
  authMode = mode;
  document.getElementById('tab-signin').classList.toggle('active', mode === 'signin');
  document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
  document.getElementById('auth-submit-btn').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
  document.getElementById('auth-switch-text').innerHTML =
    mode === 'signin'
      ? "Don't have an account? <button type="button" id="auth-switch-btn" onclick="setMode('signup')">Sign up</button>"
      : "Already have an account? <button type="button" id="auth-switch-btn" onclick="setMode('signin')">Sign in</button>";
  clearError();
}
window.setMode = setMode;
document.getElementById('tab-signin').addEventListener('click', () => setMode('signin'));
document.getElementById('tab-signup').addEventListener('click', () => setMode('signup'));
document.getElementById('auth-switch-btn').addEventListener('click', () => setMode(authMode === 'signin' ? 'signup' : 'signin'));

// ── Error / form helpers ────────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function clearError() {
  document.getElementById('auth-error').style.display = 'none';
}
function setLoading(loading) {
  const btn = document.getElementById('auth-submit-btn');
  const email = document.getElementById('auth-email');
  const pw = document.getElementById('auth-password');
  btn.disabled = loading;
  email.disabled = loading;
  pw.disabled = loading;
  btn.textContent = loading ? (authMode === 'signin' ? 'Signing in…' : 'Creating account…') : (authMode === 'signin' ? 'Sign In' : 'Create Account');
}

// ── Form submission ────────────────────────────────────────────────────────
window.handleAuthSubmit = async function (e) {
  e.preventDefault();
  clearError();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!email || !password) { showError('Please fill in all fields.'); return; }
  setLoading(true);
  try {
    const result = authMode === 'signin'
      ? await signIn({ email, password })
      : await signUp({ email, password });
    if (result.error) {
      showError(result.error.message || 'Authentication failed.');
    } else {
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next');
      window.location.href = next && next.startsWith('/') ? next : '/dashboard.html';
    }
  } catch (err) {
    showError('Connection error. Please check your network and try again.');
  } finally {
    setLoading(false);
  }
};
</script>

<!-- NEW: Robot interactions + panel chat (ADD-ONLY layer) -->
<script>
(function(){
  var robot = document.getElementById('robot-wrapper');
  var panelMsgs = document.getElementById('panel-msgs');
  var panelInput = document.getElementById('panel-input');
  var panelSend = document.getElementById('panel-send');
  var EXACT_MSG = 'welcome to Tusabots, we are currently under maintenance, more bots coming soon';

  // Bot message helper
  function addBot(text) {
    var d = document.createElement('div');
    d.style.cssText = 'display:flex;gap:6px;align-items:flex-end;animation:msgFadeIn 0.3s ease forwards;opacity:0';
    d.innerHTML = '<div style="width:22px;height:22px;border-radius:50%;background:rgba(57,217,138,0.15);border:1px solid rgba(57,217,138,0.2);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0">&#x1F916;</div><div style="max-width:80%;padding:8px 12px;border-radius:12px;font-size:0.8rem;line-height:1.45;background:rgba(57,217,138,0.1);border:1px solid rgba(57,217,138,0.18);border-bottom-left-radius:3px;color:#c8f0dc">' + text + '</div>';
    d.style.opacity = '1';
    panelMsgs.appendChild(d);
    panelMsgs.scrollTop = panelMsgs.scrollHeight;
  }

  // Pre-load welcome message
  addBot(EXACT_MSG);

  // Typing indicator helper
  function addTyping() {
    var t = document.createElement('div');
    t.id = 'panel-typing';
    t.style.cssText = 'display:flex;gap:6px;align-items:center;animation:msgFadeIn 0.3s ease forwards;opacity:0';
    t.innerHTML = '<div style="width:22px;height:22px;border-radius:50%;background:rgba(57,217,138,0.15);border:1px solid rgba(57,217,138,0.2);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0">&#x1F916;</div><div style="display:flex;gap:3px;padding:8px 12px;background:rgba(57,217,138,0.08);border:1px solid rgba(57,217,138,0.15);border-radius:12px;border-bottom-left-radius:3px"><span style="width:5px;height:5px;border-radius:50%;background:#39d98a;opacity:0.5;animation:dotBounce 1.2s ease-in-out infinite"></span><span style="width:5px;height:5px;border-radius:50%;background:#39d98a;opacity:0.5;animation:dotBounce 1.2s ease-in-out infinite;animation-delay:0.15s"></span><span style="width:5px;height:5px;border-radius:50%;background:#39d98a;opacity:0.5;animation:dotBounce 1.2s ease-in-out infinite;animation-delay:0.3s"></span></div>';
    t.style.opacity = '1';
    panelMsgs.appendChild(t);
    panelMsgs.scrollTop = panelMsgs.scrollHeight;
  }
  function removeTyping() {
    var t = document.getElementById('panel-typing');
    if (t) t.remove();
  }

  // Send message
  function send() {
    var v = panelInput.value.trim();
    if (!v) return;
    // User message
    var u = document.createElement('div');
    u.style.cssText = 'display:flex;gap:6px;align-items:flex-end;flex-direction:row-reverse;animation:msgFadeIn 0.3s ease forwards;opacity:0';
    u.innerHTML = '<div style="width:22px;height:22px;border-radius:50%;background:rgba(57,217,138,0.15);border:1px solid rgba(57,217,138,0.2);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0">&#x1F916;</div><div style="max-width:80%;padding:8px 12px;border-radius:12px;font-size:0.8rem;line-height:1.45;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-bottom-right-radius:3px;color:#8b949e">' + v + '</div>';
    u.style.opacity = '1';
    panelMsgs.appendChild(u);
    panelInput.value = '';
    panelMsgs.scrollTop = panelMsgs.scrollHeight;
    addTyping();
    setTimeout(function() { removeTyping(); addBot(EXACT_MSG); }, 800);
  }
  panelSend.addEventListener('click', send);
  panelInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') send(); });

  // Robot interaction state
  var holdTimer = null;
  var startX = 0;
  var totalRotation = 0;
  var spinning = false;
  var spinRaf = null;
  var jumpActive = false;
  var currentX = 0;

  // Jump
  function doJump() {
    if (jumpActive) return;
    jumpActive = true;
    robot.classList.remove('idle');
    robot.style.animation = 'none';
    robot.style.transform = 'translateY(0)';
    var start = null;
    var dur = 500;
    function step(ts) {
      if (!start) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      var y = Math.sin(p * Math.PI) * -24;
      robot.style.transform = 'translateY(' + y + 'px)';
      if (p < 1) { requestAnimationFrame(step); }
      else { robot.style.transform = ''; jumpActive = false; }
    }
    requestAnimationFrame(step);
  }

  // Spin
  function startSpin(clientX) {
    startX = clientX;
    currentX = clientX;
    totalRotation = 0;
    spinning = true;
    robot.classList.remove('idle');
    robot.style.animation = 'none';
    robot.style.transition = '';
    function spin() {
      if (!spinning) return;
      var dx = currentX - startX;
      totalRotation += dx * 0.3;
      startX = currentX;
      robot.style.transform = 'rotate(' + totalRotation + 'deg)';
      spinRaf = requestAnimationFrame(spin);
    }
    spinRaf = requestAnimationFrame(spin);
  }
  function stopSpin() {
    spinning = false;
    if (spinRaf) cancelAnimationFrame(spinRaf);
    robot.style.transform = '';
    robot.style.transition = '';
    robot.classList.add('idle');
  }

  // Mouse: click = jump, hold > 200ms = spin
  robot.addEventListener('mousedown', function(e) {
    if (jumpActive) { clearTimeout(holdTimer); return; }
    holdTimer = setTimeout(function() { startSpin(e.clientX); }, 200);
  });
  robot.addEventListener('mouseup', function(e) {
    clearTimeout(holdTimer);
    if (spinning) { stopSpin(); }
    else { doJump(); }
  });
  robot.addEventListener('mousemove', function(e) {
    if (spinning) { e.preventDefault(); currentX = e.clientX; }
  });
  // Touch support
  robot.addEventListener('touchstart', function(e) {
    holdTimer = setTimeout(function() { startSpin(e.touches[0].clientX); }, 200);
  }, { passive: true });
  robot.addEventListener('touchend', function(e) {
    clearTimeout(holdTimer);
    if (spinning) { stopSpin(); }
    else { doJump(); }
  });
  robot.addEventListener('touchmove', function(e) {
    if (spinning) { e.preventDefault(); currentX = e.touches[0].clientX; }
  }, { passive: false });
})();
</script>
