<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TusaBots — Dashboard</title>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #0d1117;
  --bg-card: rgba(15, 20, 35, 0.6);
  --accent-cyan: #00d4ff;
  --accent-blue: #4a6cf7;
  --accent-purple: #7b61ff;
  --accent-green: #00ff88;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #484f58;
  --glass-bg: rgba(13, 17, 23, 0.7);
  --glass-border: rgba(0, 212, 255, 0.15);
  --glow-cyan: 0 0 20px rgba(0, 212, 255, 0.3);
  --radius: 16px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Nav */
nav {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: var(--glass-bg);
  border-bottom: 1px solid var(--glass-border);
  padding: 0 2rem;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  font-size: 1.2rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-decoration: none;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.nav-user-email {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.nav-back, .nav-signout {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.9rem;
  cursor: pointer;
  transition: color var(--transition);
  background: none;
  border: none;
  font-family: inherit;
  font-size: 0.9rem;
  padding: 0;
}

.nav-back:hover, .nav-signout:hover { color: var(--accent-cyan); }

/* Dashboard Content */
.dashboard {
  flex: 1;
  max-width: 800px;
  width: 100%;
  margin: 0 auto;
  padding: 3rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

/* Chat Area */
.chat-container {
  flex: 1;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  min-height: 400px;
}

.chat-messages {
  flex: 1;
  padding: 1.5rem;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.chat-placeholder {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 0.95rem;
  text-align: center;
  padding: 2rem;
}

.chat-placeholder span {
  background: rgba(0, 212, 255, 0.06);
  border: 1px solid rgba(0, 212, 255, 0.12);
  border-radius: 12px;
  padding: 1rem 2rem;
}

.chat-bubble {
  max-width: 75%;
  padding: 0.75rem 1.1rem;
  border-radius: 14px;
  font-size: 0.95rem;
  line-height: 1.5;
}

.chat-bubble.bot {
  align-self: flex-start;
  background: rgba(0, 212, 255, 0.08);
  border: 1px solid rgba(0, 212, 255, 0.15);
  color: var(--text-primary);
}

.chat-bubble.user {
  align-self: flex-end;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  color: #fff;
}

/* Input */
.chat-input-area {
  display: flex;
  gap: 0.75rem;
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--glass-border);
}

.chat-input {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 0.75rem 1rem;
  color: var(--text-primary);
  font-size: 0.95rem;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.chat-input::placeholder { color: var(--text-muted); }
.chat-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1); }

.chat-send-btn {
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  border: none;
  border-radius: 12px;
  padding: 0.75rem 1.4rem;
  color: #fff;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
}

.chat-send-btn:hover { transform: translateY(-2px); box-shadow: var(--glow-cyan); }
.chat-send-btn:active { transform: translateY(0); }
.chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Footer */
footer {
  text-align: center;
  padding: 2rem;
  color: var(--text-muted);
  font-size: 0.85rem;
  border-top: 1px solid var(--glass-border);
}

@media (max-width: 768px) {
  nav { padding: 0 1rem; }
  /* Lock to the real visible height (dvh handles the mobile address bar) so the
     chat fills the screen and the input bar stays visible without page scroll. */
  body { min-height: 100dvh; height: 100dvh; }
  .dashboard { padding: 0.75rem; gap: 0.75rem; flex: 1 1 auto; min-height: 0; max-width: 100%; }
  .chat-container { flex: 1 1 auto; min-height: 0; }
  .chat-messages { flex: 1 1 auto; min-height: 0; padding: 1rem; }
  /* Keep input + send on one row, pinned at the bottom, always visible. */
  .chat-input-area { flex-direction: row; flex-shrink: 0; padding: 0.75rem 1rem; }
  .chat-input { font-size: 16px; } /* 16px stops iOS zoom-jump on focus */
}
</style>

<script>

<script type="module">
import {
  requireAuth,
  authFetch,
  onAuthStateChange,
  getSession,
  signOut,
  signIn,
  signUp,
  handlePostLoginRedirect,
} from '/lib/auth.js';

// ── Phase 2: Enforce auth gate ───────────────────────────────────────────────
// requireAuth redirects to index.html with ?next=<current-url> if no session.
// This is synchronous enough to block dashboard render for unauthenticated users.
(async () => {
  const session = await requireAuth('/index.html', window.location.href);
  if (!session) return; // Redirected

  // Auth passed — populate window state
  window.__TUSABOTS_SESSION__ = session;
  window.__TUSABOTS_USER__ = session.user;
  updateNav(session.user?.email);

  console.log('[TusaBots] Auth gate passed —', session.user?.email);
})();

// ── Auth state listener: redirect on sign-out or token expiry ───────────────
onAuthStateChange((event, session) => {
  window.__TUSABOTS_SESSION__ = session;
  window.__TUSABOTS_USER__ = session?.user ?? null;
  updateNav(session?.user?.email);

  if (!session) {
    console.log('[TusaBots] Session ended — redirecting to login.');
    window.location.href = '/index.html';
  }
});

// ── Auth-fetch helper (attaches Bearer token when session exists) ───────────
window.authFetch = authFetch;

// ── Expose helpers to classic script block ─────────────────────────────────
window.getCurrentUser = () => window.__TUSABOTS_USER__;
window.isLoggedIn     = () => window.__TUSABOTS_SESSION__ !== null;

// ── Navigation bar state ────────────────────────────────────────────────────
function updateNav(email) {
  const navRight = document.getElementById('nav-right');
  if (email) {
    navRight.innerHTML =
      `<span class="nav-user-email">${email}</span>` +
      `<button class="nav-signout" id="nav-signout-btn">Sign out</button>`;
    document.getElementById('nav-signout-btn').addEventListener('click', async () => {
      await signOut();
      window.location.href = '/index.html';
    });
  } else {
    navRight.innerHTML = '';
  }
}
</script>

<script>
// ── State ────────────────────────────────────────────────────────────────────
// Workspaces removed — the chat always uses the 'default' (General) workspace,
// preserving existing history/memory there. Backend contract is unchanged.
const currentWorkspace = 'default';
const workspaceHistories = {};

// ── DOM refs ─────────────────────────────────────────────────────────────────
const messagesEl       = document.getElementById('chat-messages');
const placeholder      = document.getElementById('chat-placeholder');
const input            = document.getElementById('chat-input');
const sendBtn          = document.getElementById('chat-send');

// ── Load history for the chat (peek mode — no AI call, no message save) ──
async function loadHistoryForWorkspace(workspaceId) {
  try {
    const res = await authFetch('/.netlify/functions/chat', {
      method: 'POST',
      body: JSON.stringify({ message: '[peek]', history: [], workspaceId, peekMode: true })
    });
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data.history)) {
      data.history.forEach(msg =>
        addBubble(msg.content, msg.role === 'assistant' ? 'bot' : 'user', false)
      );
      workspaceHistories[workspaceId] = data.history;
    }
  } catch (e) { console.warn('[TusaBots] loadHistoryForWorkspace failed', e); }
}

// ── Send message ─────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addBubble(text, 'user');
  setInputEnabled(false);

  const history = workspaceHistories[currentWorkspace] || [];

  try {
    const res = await authFetch('/.netlify/functions/chat', {
      method: 'POST',
      body: JSON.stringify({ message: text, history, workspaceId: currentWorkspace })
    });

    if (res.status === 401) {
      addBubble('Session expired. Please sign in again.', 'bot');
      window.location.href = '/index.html';
      return;
    }

    const data = await res.json();

    if (data.reply) {
      addBubble(data.reply, 'bot');
      const h = workspaceHistories[currentWorkspace] || [];
      h.push({ role: 'user', content: text });
      h.push({ role: 'assistant', content: data.reply });
      workspaceHistories[currentWorkspace] = h.length > 20 ? h.slice(-20) : h;
    } else {
      addBubble('Error: ' + (data.detail || data.error || 'Unknown'), 'bot');
    }
  } catch (e) { addBubble('Connection error. Try again.', 'bot'); }

  setInputEnabled(true);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function addBubble(text, type, scroll = true) {
  const ph = document.getElementById('chat-placeholder');
  if (ph) ph.remove();
  const div = document.createElement('div');
  div.className = 'chat-bubble ' + type;
  div.textContent = text;
  messagesEl.appendChild(div);
  if (scroll) messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setInputEnabled(enabled) {
  input.disabled = !enabled;
  sendBtn.disabled = !enabled;
  sendBtn.textContent = enabled ? 'Send' : '...';
}

// ── Init ──────────────────────────────────────────────────────────────────────
workspaceHistories[currentWorkspace] = [];

// ── Wire up the input controls ───────────────────────────────────────────────
sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Load any saved conversation on page load.
loadHistoryForWorkspace(currentWorkspace);
</script>
