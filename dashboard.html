<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TusaBots — Dashboard</title>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #0d1117;
  --bg-card: rgba(15, 20, 35, 0.6);
  --accent-cyan: #00d4ff;
  --accent-blue: #4a6cf7;
  --accent-purple: #7b61ff;
  --accent-green: #00ff88;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #484f58;
  --glass-bg: rgba(13, 17, 23, 0.7);
  --glass-border: rgba(0, 212, 255, 0.15);
  --glow-cyan: 0 0 20px rgba(0, 212, 255, 0.3);
  --radius: 16px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Nav */
nav {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: var(--glass-bg);
  border-bottom: 1px solid var(--glass-border);
  padding: 0 2rem;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  font-size: 1.2rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-decoration: none;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.nav-user-email {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.nav-back, .nav-signout {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.9rem;
  cursor: pointer;
  transition: color var(--transition);
  background: none;
  border: none;
  font-family: inherit;
  font-size: 0.9rem;
  padding: 0;
}

.nav-back:hover, .nav-signout:hover { color: var(--accent-cyan); }

/* Dashboard layout */
.dashboard {
  flex: 1;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  padding: 2rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

/* Workspace bar */
.workspace-bar {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.workspace-label {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-right: 0.25rem;
}

.workspace-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.35rem 0.85rem;
  border-radius: 100px;
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-secondary);
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
}

.workspace-pill:hover {
  border-color: rgba(0, 212, 255, 0.4);
  color: var(--accent-cyan);
  background: rgba(0, 212, 255, 0.06);
}

.workspace-pill.active {
  border-color: var(--accent-cyan);
  background: rgba(0, 212, 255, 0.1);
  color: var(--accent-cyan);
  box-shadow: 0 0 12px rgba(0, 212, 255, 0.15);
}

.workspace-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

/* Dashboard content */
.dashboard-header {
  text-align: center;
}

.dashboard-header h1 {
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  font-weight: 800;
  background: linear-gradient(135deg, #fff, var(--accent-cyan), var(--accent-blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.4rem;
}

.dashboard-header p {
  color: var(--text-secondary);
  font-size: 1rem;
}

/* Chat Area */
.chat-container {
  flex: 1;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  min-height: 400px;
}

.chat-messages {
  flex: 1;
  padding: 1.5rem;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.15); border-radius: 4px; }

.chat-placeholder {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 0.95rem;
  text-align: center;
  padding: 2rem;
}

.chat-placeholder span {
  background: rgba(0, 212, 255, 0.06);
  border: 1px solid rgba(0, 212, 255, 0.12);
  border-radius: 12px;
  padding: 1rem 2rem;
}

.chat-bubble {
  max-width: 75%;
  padding: 0.75rem 1.1rem;
  border-radius: 14px;
  font-size: 0.95rem;
  line-height: 1.5;
  animation: bubbleIn 0.25s ease forwards;
}

@keyframes bubbleIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.chat-bubble.bot {
  align-self: flex-start;
  background: rgba(0, 212, 255, 0.08);
  border: 1px solid rgba(0, 212, 255, 0.15);
  color: var(--text-primary);
}

.chat-bubble.user {
  align-self: flex-end;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  color: #fff;
}

/* Workspace switch toast */
.workspace-toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: rgba(0, 212, 255, 0.12);
  border: 1px solid rgba(0, 212, 255, 0.35);
  border-radius: 100px;
  padding: 0.5rem 1.25rem;
  font-size: 0.85rem;
  color: var(--accent-cyan);
  font-weight: 500;
  opacity: 0;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s;
  pointer-events: none;
  z-index: 100;
}

.workspace-toast.visible {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* Input */
.chat-input-area {
  display: flex;
  gap: 0.75rem;
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--glass-border);
}

.chat-input {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 0.75rem 1rem;
  color: var(--text-primary);
  font-size: 0.95rem;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.chat-input::placeholder { color: var(--text-muted); }
.chat-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1); }

.chat-send-btn {
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  border: none;
  border-radius: 12px;
  padding: 0.75rem 1.4rem;
  color: #fff;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
}

.chat-send-btn:hover { transform: translateY(-2px); box-shadow: var(--glow-cyan); }
.chat-send-btn:active { transform: translateY(0); }
.chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Footer */
footer {
  text-align: center;
  padding: 2rem;
  color: var(--text-muted);
  font-size: 0.85rem;
  border-top: 1px solid var(--glass-border);
}

@media (max-width: 768px) {
  nav { padding: 0 1rem; }
  .dashboard { padding: 1.5rem 1rem; }
  .chat-input-area { flex-direction: column; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">🤖 TusaBots</a>
  <div class="nav-right" id="nav-right">
    <!-- Populated by JS: email + sign-out button when logged in -->
  </div>
</nav>

<!-- Workspace switch toast -->
<div class="workspace-toast" id="workspace-toast"></div>

<main class="dashboard">
  <!-- Workspace selector bar -->
  <div class="workspace-bar" id="workspace-bar">
    <span class="workspace-label">Workspace</span>
    <!-- Pills injected by JS based on AVAILABLE_WORKSPACES -->
  </div>

  <div class="dashboard-header">
    <h1>Your TusaBot</h1>
    <p id="workspace-subtitle">General workspace</p>
  </div>

  <div class="chat-container">
    <div class="chat-messages" id="chat-messages">
      <div class="chat-placeholder" id="chat-placeholder">
        <span>🤖 Your bot is ready</span>
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" class="chat-input" id="chat-input" placeholder="Type a message or say 'open work workspace'..." autocomplete="off">
      <button class="chat-send-btn" id="chat-send" type="button">Send</button>
    </div>
  </div>
</main>

<footer>
  <p>TusaBots © 2026</p>
</footer>

<script>
// Inject Supabase env vars into window.ENV so lib/ modules can read them
// without needing a build step or import.meta.env (not available in plain HTML).
// Values come from Netlify environment variables set in the dashboard.
window.ENV = {
  get VITE_SUPABASE_URL()     { return window.__SUPABASE_URL__;     },
  get VITE_SUPABASE_ANON_KEY() { return window.__SUPABASE_ANON_KEY__; },
};
</script>
<script type="module">
import {
  requireAuth,
  authFetch,
  onAuthStateChange,
  getSession,
  signOut,
} from '/lib/auth.js';

// ── Auth gate ────────────────────────────────────────────────────────────────
(async () => {
  const session = await requireAuth('/index.html', window.location.href);
  if (!session) return;

  window.__TUSABOTS_SESSION__ = session;
  window.__TUSABOTS_USER__ = session.user;
  updateNav(session.user?.email);
  console.log('[TusaBots] Auth gate passed —', session.user?.email);
})();

onAuthStateChange((event, session) => {
  window.__TUSABOTS_SESSION__ = session;
  window.__TUSABOTS_USER__ = session?.user ?? null;
  updateNav(session?.user?.email);
  if (!session) window.location.href = '/index.html';
});

window.authFetch = authFetch;
window.getCurrentUser = () => window.__TUSABOTS_USER__;
window.isLoggedIn     = () => window.__TUSABOTS_SESSION__ !== null;

function updateNav(email) {
  const navRight = document.getElementById('nav-right');
  if (email) {
    navRight.innerHTML =
      `<span class="nav-user-email">${email}</span>` +
      `<button class="nav-signout" id="nav-signout-btn">Sign out</button>`;
    document.getElementById('nav-signout-btn').addEventListener('click', async () => {
      await signOut();
      window.location.href = '/index.html';
    });
  } else {
    navRight.innerHTML = '';
  }
}
</script>

<script>
// ── Workspace configuration ───────────────────────────────────────────────────
// Extend this list to add new workspaces.
// Each entry: { id, label }
// id must be lowercase alphanumeric + hyphens (used as workspace_id in DB)
const AVAILABLE_WORKSPACES = [
  { id: 'default',      label: 'General' },
  { id: 'work',        label: 'Work' },
  { id: 'personal',    label: 'Personal' },
  { id: 'tusabot',     label: 'TusaBot' },
  { id: 'deploy-notes',label: 'Deploy Notes' },
];

const WORKSPACE_META = {
  default:      { subtitle: 'General workspace' },
  work:         { subtitle: 'Work workspace' },
  personal:     { subtitle: 'Personal workspace' },
  tusabot:      { subtitle: 'TusaBot workspace' },
  'deploy-notes':{ subtitle: 'Deploy Notes workspace' },
};

// ── State ────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'tusabots_workspace';

// Current workspace: default or last-selected
const currentWorkspace = localStorage.getItem(STORAGE_KEY) || 'default';

// Per-workspace chat histories stored here
const workspaceHistories = {};

// ── DOM refs ─────────────────────────────────────────────────────────────────
const workspaceBar    = document.getElementById('workspace-bar');
const workspaceSubtitle = document.getElementById('workspace-subtitle');
const messagesEl      = document.getElementById('chat-messages');
const placeholder     = document.getElementById('chat-placeholder');
const input           = document.getElementById('chat-input');
const sendBtn         = document.getElementById('chat-send');
const toastEl         = document.getElementById('workspace-toast');

// ── Build workspace pills ────────────────────────────────────────────────────
function renderWorkspacePills() {
  // Remove existing pills (keep the label)
  const existing = workspaceBar.querySelectorAll('.workspace-pill');
  existing.forEach(el => el.remove());

  AVAILABLE_WORKSPACES.forEach(ws => {
    const pill = document.createElement('button');
    pill.className = 'workspace-pill' + (ws.id === currentWorkspace ? ' active' : '');
    pill.type = 'button';
    pill.innerHTML = `<span class="workspace-dot"></span>${ws.label}`;
    pill.addEventListener('click', () => switchWorkspace(ws.id));
    workspaceBar.appendChild(pill);
  });
}

// ── Switch workspace ─────────────────────────────────────────────────────────
async function switchWorkspace(workspaceId) {
  if (workspaceId === currentWorkspace) return;

  // Persist selection
  localStorage.setItem(STORAGE_KEY, workspaceId);

  // Update active pill
  workspaceBar.querySelectorAll('.workspace-pill').forEach(pill => {
    const isActive = pill.textContent.trim() === AVAILABLE_WORKSPACES.find(w => w.id === workspaceId)?.label;
    pill.classList.toggle('active', isActive);
  });

  // Update subtitle
  workspaceSubtitle.textContent = WORKSPACE_META[workspaceId]?.subtitle || workspaceId;

  // Show toast
  showToast(`Switched to ${workspaceId}`);

  // Clear chat UI
  messagesEl.innerHTML = '';
  const ph = document.createElement('div');
  ph.className = 'chat-placeholder';
  ph.innerHTML = '<span>🤖 Ready in workspace: ' + workspaceId + '</span>';
  messagesEl.appendChild(ph);

  // Reload history for new workspace from server
  await loadHistoryForWorkspace(workspaceId);
}

// ── Load history for a workspace (fetch last N from server) ───────────────────
// Phase 1: we don't persist per-workspace frontend history across page loads.
// The server stores all messages; frontend history is rebuilt from the chat function's
// response. We send an empty history array and rely on
// ── Load history for a workspace from the server ───────────────────────────────
// We POST a special "peek" message that is a no-op; the server returns the
// scoped messages without saving a new user/assistant pair.
// Recognised by chat.js via a flag in the request body.
async function loadHistoryForWorkspace(workspaceId) {
  // Send a no-save peek request to get the last 20 messages for this workspace
  // without adding to history. chat.js handles peekMode: true specially.
  try {
    const res = await authFetch('/.netlify/functions/chat', {
      method: 'POST',
      body: JSON.stringify({
        message: '[peek]',
        history: [],
        workspaceId,
        peekMode: true,
      })
    });
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data.history)) {
      // Restore bubbles from server-sent history
      data.history.forEach(msg => {
        addBubble(msg.content, msg.role === 'assistant' ? 'bot' : 'user', false /* no scroll */);
      });
      // Store in memory for sendMessage()
      workspaceHistories[workspaceId] = data.history;
    }
  } catch (e) {
    console.warn('[TusaBots] loadHistoryForWorkspace failed', e);
  }
}

// ── Send message ─────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addBubble(text, 'user');
  setInputEnabled(false);

  // Grab and clear this workspace's history
  const history = workspaceHistories[currentWorkspace] || [];

  try {
    const res = await authFetch('/.netlify/functions/chat', {
      method: 'POST',
      body: JSON.stringify({ message: text, history, workspaceId: currentWorkspace })
    });

    if (res.status === 401) {
      addBubble('Session expired. Please sign in again.', 'bot');
      window.location.href = '/index.html';
      return;
    }

    const data = await res.json();

    // ── Workspace switch response ──
    if (data.workspaceSwitch) {
      // Bot confirmed a workspace switch — update UI
      const newWs = data.workspaceSwitch;
      localStorage.setItem(STORAGE_KEY, newWs);
      workspaceSubtitle.textContent = WORKSPACE_META[newWs]?.subtitle || newWs;
      renderWorkspacePills();
      showToast(`Switched to ${newWs}`);
      messagesEl.innerHTML = '';
      const ph = document.createElement('div');
      ph.className = 'chat-placeholder';
      ph.innerHTML = `<span>🤖 Workspace: ${newWs} — ask me anything</span>`;
      messagesEl.appendChild(ph);
      workspaceHistories[newWs] = [];
      return;
    }

    if (data.reply) {
      addBubble(data.reply, 'bot');
      // Update stored history
      const h = workspaceHistories[currentWorkspace] || [];
      h.push({ role: 'user', content: text });
      h.push({ role: 'assistant', content: data.reply });
      if (h.length > 20) workspaceHistories[currentWorkspace] = h.slice(-20);
      else workspaceHistories[currentWorkspace] = h;
    } else {
      addBubble('Error: ' + (data.detail || data.error || 'Unknown'), 'bot');
    }
  } catch (e) {
    addBubble('Connection error. Try again.', 'bot');
  }

  setInputEnabled(true);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function addBubble(text, type, scroll = true) {
  const ph = document.getElementById('chat-placeholder');
  if (ph) ph.remove();

  const div = document.createElement('div');
  div.className = 'chat-bubble ' + type;
  div.textContent = text;
  messagesEl.appendChild(div);
  if (scroll) messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setInputEnabled(enabled) {
  input.disabled = !enabled;
  sendBtn.disabled = !enabled;
  sendBtn.textContent = enabled ? 'Send' : '...';
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('visible');
  clearTimeout(toastEl._timer);
  toastEl._timer = setTimeout(() => toastEl.classList.remove('visible'), 2500);
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

// ── Init ──────────────────────────────────────────────────────────────────────
// Render pills and set initial subtitle
renderWorkspacePills();
workspaceSubtitle.textContent = WORKSPACE_META[currentWorkspace]?.subtitle || currentWorkspace;

// Start with an empty in-memory history; will be populated by sendMessage
workspaceHistories[currentWorkspace] = [];


// ── Load history for a workspace from the server ───────────────────────────────
// POST a no-save peek to get last 20 messages for this workspace.
async function loadHistoryForWorkspace(workspaceId) {
  try {
    const res = await authFetch('/.netlify/functions/chat', {
      method: 'POST',
      body: JSON.stringify({ message: '[peek]', history: [], workspaceId, peekMode: true })
    });
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data.history)) {
      data.history.forEach(msg => addBubble(msg.content, msg.role === 'assistant' ? 'bot' : 'user', false));
      workspaceHistories[workspaceId] = data.history;
    }
  } catch (e) { console.warn('[TusaBots] loadHistoryForWorkspace failed', e); }
}

// ── Send message ─────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addBubble(text, 'user');
  setInputEnabled(false);

  const history = workspaceHistories[currentWorkspace] || [];

  try {
    const res = await authFetch('/.netlify/functions/chat', {
      method: 'POST',
      body: JSON.stringify({ message: text, history, workspaceId: currentWorkspace })
    });

    if (res.status === 401) {
      addBubble('Session expired. Please sign in again.', 'bot');
      window.location.href = '/index.html';
      return;
    }

    const data = await res.json();

    // Workspace switch from bot command
    if (data.workspaceSwitch) {
      const newWs = data.workspaceSwitch;
      localStorage.setItem(STORAGE_KEY, newWs);
      workspaceSubtitle.textContent = WORKSPACE_META[newWs]?.subtitle || newWs;
      renderWorkspacePills();
      showToast('Switched to ' + newWs);
      messagesEl.innerHTML = '';
      const ph = document.createElement('div');
      ph.className = 'chat-placeholder';
      ph.innerHTML = '<span>🤖 Workspace: ' + newWs + ' — ask me anything</span>';
      messagesEl.appendChild(ph);
      workspaceHistories[newWs] = [];
      return;
    }

    if (data.reply) {
      addBubble(data.reply, 'bot');
      const h = workspaceHistories[currentWorkspace] || [];
      h.push({ role: 'user', content: text });
      h.push({ role: 'assistant', content: data.reply });
      workspaceHistories[currentWorkspace] = h.length > 20 ? h.slice(-20) : h;
    } else {
      addBubble('Error: ' + (data.detail || data.error || 'Unknown'), 'bot');
    }
  } catch (e) { addBubble('Connection error. Try again.', 'bot'); }

  setInputEnabled(true);
}

function addBubble(text, type, scroll = true) {
  const ph = document.getElementById('chat-placeholder');
  if (ph) ph.remove();
  const div = document.createElement('div');
  div.className = 'chat-bubble ' + type;
  div.textContent = text;
  messagesEl.appendChild(div);
  if (scroll) messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setInputEnabled(enabled) {
  input.disabled = !enabled;
  sendBtn.disabled = !enabled;
  sendBtn.textContent = enabled ? 'Send' : '...';
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('visible');
  clearTimeout(toastEl._timer);
  toastEl._timer = setTimeout(() => toastEl.classList.remove('visible'), 2500);
}

input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

// ── Init ──────────────────────────────────────────────────────────────────────
renderWorkspacePills();
workspaceSubtitle.textContent = WORKSPACE_META[currentWorkspace]?.subtitle || currentWorkspace;
workspaceHistories[currentWorkspace] = [];
