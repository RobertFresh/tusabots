<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TusaBots — HQ</title>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #0d1117;
  --bg-card: rgba(15, 20, 35, 0.6);
  --accent-cyan: #00d4ff;
  --accent-blue: #4a6cf7;
  --accent-purple: #7b61ff;
  --accent-green: #00ff88;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #484f58;
  --glass-bg: rgba(13, 17, 23, 0.7);
  --glass-border: rgba(0, 212, 255, 0.15);
  --glow-cyan: 0 0 20px rgba(0, 212, 255, 0.3);
  --radius: 16px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  /* Bot accent colours */
  --bot-boss: #ffc107;
  --bot-clerk: #4a6cf7;
  --bot-simpleton: #00ff88;
  --bot-unit7: #ff4444;
  --bot-commander: #8b949e;
  --bot-triggbot: #b44aff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Nav */
nav {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: var(--glass-bg);
  border-bottom: 1px solid var(--glass-border);
  padding: 0 2rem;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.nav-logo {
  font-size: 1.2rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-decoration: none;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.nav-user-email {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.nav-back, .nav-signout {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.9rem;
  cursor: pointer;
  transition: color var(--transition);
  background: none;
  border: none;
  font-family: inherit;
  padding: 0;
}

.nav-back:hover, .nav-signout:hover { color: var(--accent-cyan); }

/* ── HQ Layout ─────────────────────────────────────────── */
.hq {
  flex: 1;
  max-width: 960px;
  width: 100%;
  margin: 0 auto;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.hq-title {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text-primary);
  text-align: center;
  letter-spacing: 0.05em;
}

.hq-subtitle {
  font-size: 0.85rem;
  color: var(--text-muted);
  text-align: center;
  margin-top: -0.75rem;
}

/* ── Bot Grid ──────────────────────────────────────────── */
.bot-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
}

.bot-tile {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 1.25rem 1rem;
  cursor: pointer;
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
  position: relative;
}

.bot-tile:hover {
  transform: translateY(-3px);
  border-color: var(--tile-accent, var(--accent-cyan));
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.12);
}

.bot-tile.active {
  border-color: var(--tile-accent, var(--accent-cyan));
  box-shadow: 0 0 25px color-mix(in srgb, var(--tile-accent, var(--accent-cyan)) 30%, transparent);
}

.bot-tile .bot-head {
  width: 56px;
  height: 56px;
  position: relative;
}

.bot-tile .bot-head canvas {
  width: 56px;
  height: 56px;
  image-rendering: pixelated;
}

.bot-name {
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.bot-status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  position: absolute;
  top: 6px;
  right: 6px;
}

.bot-status-dot.online { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
.bot-status-dot.sleeping { background: #ffc107; box-shadow: 0 0 6px #ffc10744; }
.bot-status-dot.offline { background: var(--text-muted); }
.bot-status-dot.cloud { background: var(--accent-cyan); box-shadow: 0 0 6px var(--accent-cyan); }

/* ── Info Panel (below grid, expands when bot clicked) ── */
.bot-panel {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease;
  padding: 0 1.5rem;
}

.bot-panel.open {
  max-height: 800px;
  opacity: 1;
  padding: 1.5rem;
}

.panel-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--glass-border);
}

.panel-header canvas {
  width: 40px;
  height: 40px;
  image-rendering: pixelated;
}

.panel-header h2 {
  font-size: 1.1rem;
  font-weight: 700;
  flex: 1;
}

.panel-header .panel-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 0.25rem;
  transition: color var(--transition);
}

.panel-header .panel-close:hover { color: var(--text-primary); }

.panel-info {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.4rem 1rem;
  font-size: 0.9rem;
}

.panel-info .label {
  color: var(--text-muted);
  font-weight: 500;
}

.panel-info .value {
  color: var(--text-secondary);
}

.security-badge {
  display: inline-block;
  padding: 0.1rem 0.5rem;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 600;
}

.security-badge.private { background: rgba(255, 68, 68, 0.15); color: #ff6b6b; }
.security-badge.public  { background: rgba(0, 255, 136, 0.15); color: #00ff88; }

/* ── Chat inside panel ─────────────────────────────────── */
.panel-chat {
  margin-top: 1rem;
  border-top: 1px solid var(--glass-border);
  padding-top: 1rem;
}

.panel-chat-messages {
  max-height: 300px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  margin-bottom: 0.75rem;
  padding: 0.5rem;
}

.panel-chat-placeholder {
  color: var(--text-muted);
  font-size: 0.85rem;
  text-align: center;
  padding: 1.5rem;
}

.chat-bubble {
  max-width: 80%;
  padding: 0.6rem 1rem;
  border-radius: 12px;
  font-size: 0.9rem;
  line-height: 1.5;
}

.chat-bubble.bot {
  align-self: flex-start;
  background: rgba(0, 212, 255, 0.08);
  border: 1px solid rgba(0, 212, 255, 0.15);
  color: var(--text-primary);
}

.chat-bubble.user {
  align-self: flex-end;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  color: #fff;
}

.panel-chat-input-area {
  display: flex;
  gap: 0.5rem;
}

.panel-chat-input {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  padding: 0.6rem 0.9rem;
  color: var(--text-primary);
  font-size: 0.9rem;
  font-family: inherit;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.panel-chat-input::placeholder { color: var(--text-muted); }
.panel-chat-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1); }

.panel-chat-send {
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  border: none;
  border-radius: 10px;
  padding: 0.6rem 1.2rem;
  color: #fff;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
}

.panel-chat-send:hover { transform: translateY(-1px); box-shadow: var(--glow-cyan); }
.panel-chat-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.panel-chat-unavailable {
  color: var(--text-muted);
  font-size: 0.85rem;
  text-align: center;
  padding: 1rem;
  border-top: 1px solid var(--glass-border);
  margin-top: 1rem;
  font-style: italic;
}

/* ── Footer ────────────────────────────────────────────── */
footer {
  text-align: center;
  padding: 2rem;
  color: var(--text-muted);
  font-size: 0.85rem;
  border-top: 1px solid var(--glass-border);
  flex-shrink: 0;
}

/* ── Cloud-only dimming (local mode) ───────────────────── */
.bot-tile.cloud-only {
  opacity: 0.35;
  filter: grayscale(0.7);
  cursor: default;
}

.bot-tile.cloud-only:hover {
  transform: none;
  border-color: var(--glass-border);
  box-shadow: none;
}

/* ── Float animation for bot heads ─────────────────────── */
@keyframes botFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

.bot-tile .bot-head {
  animation: botFloat 3s ease-in-out infinite;
}

.bot-tile:nth-child(2) .bot-head { animation-delay: -0.5s; }
.bot-tile:nth-child(3) .bot-head { animation-delay: -1s; }
.bot-tile:nth-child(4) .bot-head { animation-delay: -1.5s; }
.bot-tile:nth-child(5) .bot-head { animation-delay: -2s; }
.bot-tile:nth-child(6) .bot-head { animation-delay: -2.5s; }

/* ── Blink animation for eyes ──────────────────────────── */
@keyframes blink {
  0%, 92%, 100% { opacity: 1; }
  96% { opacity: 0; }
}

/* ── Mobile ────────────────────────────────────────────── */
@media (max-width: 768px) {
  nav { padding: 0 1rem; }
  body { min-height: 100dvh; }
  .hq { padding: 1rem; gap: 1rem; }
  .bot-grid { grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  .bot-tile { padding: 0.9rem 0.6rem; }
  .bot-tile .bot-head { width: 44px; height: 44px; }
  .bot-tile .bot-head canvas { width: 44px; height: 44px; }
  .bot-name { font-size: 0.65rem; }
  .panel-chat-input { font-size: 16px; }
  .hq-title { font-size: 1.1rem; }
}

@media (max-width: 380px) {
  .bot-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">🤖 TusaBots</a>
  <div class="nav-right" id="nav-right"></div>
</nav>

<main class="hq">
  <h1 class="hq-title">Headquarters</h1>
  <p class="hq-subtitle">Select a unit to inspect</p>

  <div class="bot-grid" id="bot-grid">
    <!-- Tiles rendered by JS -->
  </div>

  <div class="bot-panel" id="bot-panel">
    <!-- Panel content rendered by JS -->
  </div>
</main>

<footer>
  <p>TusaBots © 2026</p>
</footer>

<!-- ── Auth (conditional: skip in local mode) ──────────── -->
<script src="/js/dashboard-init.js"></script>

<!-- ── Bot Data + Pixel Art + Panel Logic ─────────────── -->
<script src="/js/dashboard-bots.js"></script>

</body>
</html>
